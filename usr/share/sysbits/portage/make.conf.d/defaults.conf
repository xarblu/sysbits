# Common Portage defaults

# accepted licenses and keywords
ACCEPT_LICENSE="* -@EULA"

# emerge options
EMERGE_DEFAULT_OPTS="--ask --verbose --keep-going --with-bdeps=y --oneshot"

# doc compression
PORTAGE_COMPRESS=""

# logging
FEATURES="${FEATURES} split-log clean-logs compress-build-logs"

# binpkg options
# (NOTE: this does NOT enable binpkg generation or usage)
FEATURES="${FEATURES} binpkg-multi-instance"
BINPKG_FORMAT="gpkg"
BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="-T0 -9"
# TTL of the Packages index
PORTAGE_BINHOST_TTL="300"

# keep basic debug info
# by default without -g*
#   - still provides better stack trace
#   - if deduped and compressed takes little extra storage
#   - if split doesn't affect binaries or build
# nostrip - disable stripping of binaries
# splitdebug - keep debug symbols seperate
# dedupdebug - deduplicate debug symbols with sys-devel/dwz
# compressdebug - compress debug symbols (patched to use zstd)
FEATURES="${FEATURES} -nostrip splitdebug -dedupdebug compressdebug"

# cgroups and observability (emerge --status)
FEATURES="${FEATURES} cgroup observability"

# portage speedup options
FEATURES="${FEATURES} parallel-fetch parallel-install"

# other misc options
FEATURES="${FEATURES} fail-clean fakeroot"

# english (non-localized) build output
LC_MESSAGES="C"
