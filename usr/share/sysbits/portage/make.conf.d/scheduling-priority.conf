# make portage compilation a low priority task
# https://wiki.gentoo.org/wiki/Portage/niceness

# SCHED_BATCH "will cause the scheduler to always
# assume that the thread is CPU-intensive" which
# is what we want for portage jobs.
# This should also be a nice hint for desktop
# oriented schedulers like scx_lavd to not consider
# portage "latency critical".
PORTAGE_SCHEDULING_POLICY="batch"

# Lowest priority among other SCHED_BATCH jobs.
PORTAGE_NICENESS="19"

# Lowest priority I/O but still in "best-effort", not "idle" because
# "idle I/O priority will only get disk time when no other
# program has asked for disk I/O for a defined grace period"
# causing insane delay when merging things to the FS.
PORTAGE_IONICE_COMMAND="ionice --class 2 --classdata 7 --pid \${PID}"
