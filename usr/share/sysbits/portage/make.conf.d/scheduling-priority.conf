# make portage compilation a low priority task
# https://wiki.gentoo.org/wiki/Portage/niceness

# lowest priority policy that should yield
# to almost anything
PORTAGE_SCHEDULING_POLICY="idle"

# technically not used by SCHED_IDLE
# but let's just set it anyway
PORTAGE_NICENESS="19"

# while portage has its own tmpfs to work in
# this might still be beneficial e.g. for reading
# large distfiles or when merging large amounts of data
# to the FS.
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"
